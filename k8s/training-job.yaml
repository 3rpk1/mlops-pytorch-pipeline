apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ml-training-storage
  namespace: ml-training
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: model-training
  namespace: ml-training
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: mlops-train:v1
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          volumeMounts:
            - name: training-config
              mountPath: /app/configs
              readOnly: true
            - name: storage
              mountPath: /app/data
              subPath: data
            - name: storage
              mountPath: /app/checkpoints
              subPath: checkpoints
      volumes:
        - name: training-config
          configMap:
            name: training-config
        - name: storage
          persistentVolumeClaim:
            claimName: ml-training-storage